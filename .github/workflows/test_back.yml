name: Testing backend
on:
  pull_request:
    paths: src-tauri
  push:
    paths: src-tauri
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Run cargo
        run: cargo fmt --check --manifest-path=src-tauri/Cargo.toml

  pre_test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpango1.0-dev libgtk-3-dev
      - name: Run cargo
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --manifest-path=src-tauri/Cargo.toml
      - name: Cache cargo registry + build
        id: cache-cargo-save
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  linting:
    needs: pre_test_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run cargo
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --manifest-path=src-tauri/Cargo.toml

  testing:
    needs: pre_test_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Run test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --manifest-path=src-tauri/Cargo.toml
